name: Purge JSDelivr Cache

on:
  push:
    paths:
      - 'kml/*.kml'

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Calculate diff
        id: diff
        run: |
          git fetch origin main
          git diff --name-only origin/main HEAD > changes.txt
          cat changes.txt
      - name: Purge Cache for changed files
        run: |
          while IFS= read -r file; do
            if [[ "$file" == *.kml ]]; then
              PURGE_URL="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$file"
              echo "Purging cache for $file at $PURGE_URL"
              curl -X GET "$PURGE_URL"
            fi
          done < changes.txt
